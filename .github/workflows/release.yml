name: Release

# Publishing is writing the version in CHANGELOG.md: when the newest section
# of the CHANGELOG names a version that has no tag yet, this workflow tests,
# builds the six files, tags the commit and publishes the release with that
# section as its notes. Nothing to run by hand. A push that leaves the
# CHANGELOG on Unreleased, or on a version already published, does nothing.
# When a step fails, nothing is published: fix it, then run this workflow
# again from the Actions tab.

on:
  push:
    branches: [develop, main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the version of the CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          heading=$(grep -m1 '^## ' CHANGELOG.md)
          version=$(echo "$heading" | sed -nE 's/^## ([0-9]+\.[0-9]+\.[0-9]+) - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p')
          if [ -z "$version" ]; then
            echo "Newest section is \"$heading\": nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q '^## Unreleased' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still has an Unreleased section beside $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          # The notes: the section of that version, without its heading.
          awk -v h="$heading" '$0==h{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md

      - uses: actions/setup-go@v5
        if: steps.version.outputs.publish == 'true'
        with:
          go-version: '1.22'

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...

      # Named for people, not for Go: macos rather than darwin, x64 beside
      # arm64 so the download page reads at a glance.
      - name: Build
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in windows/amd64/windows-x64.exe windows/arm64/windows-arm64.exe \
                        darwin/amd64/macos-intel darwin/arm64/macos-apple-silicon \
                        linux/amd64/linux-x64 linux/arm64/linux-arm64; do
            goos=${target%%/*}; rest=${target#*/}; goarch=${rest%%/*}; name=${rest#*/}
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/novalo-dev/somcp-relay/internal/app.Version=$VERSION" \
              -o "dist/somcp-relay-$name" .
          done
          (cd dist && sha256sum somcp-relay-* > SHA256SUMS.txt)
          ls -l dist

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "somcp-relay $VERSION" \
            --notes-file notes.md \
            --latest
