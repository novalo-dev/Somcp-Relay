name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      # The i18n test fails when a text is missing in one of the four
      # languages, or its placeholders differ from the English ones.
      - name: go test
        run: go test ./...
      # The installers run on merchants' computers straight from a pipe:
      # shellcheck for the shell one, PowerShell's own parser for the other.
      - name: Installers
        run: |
          shellcheck install.sh
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X github.com/novalo-dev/somcp-relay/internal/app.Version=dev-${GITHUB_SHA::7}" -o oso-${{ matrix.goos }}-${{ matrix.goarch }}$([ "${{ matrix.goos }}" = windows ] && echo .exe) .
      - uses: actions/upload-artifact@v4
        with:
          name: oso-${{ matrix.goos }}-${{ matrix.goarch }}
          path: oso-*
