<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>somcp-relay</title>
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--ink:#16181D;--muted:#5F6672;--line:#E2E5EA;--soft:#F1F3F6;
  --accent:#3B5BDB;--accent-ink:#2944B8;--accent-soft:#EDF1FD;
  --on-accent:#FFFFFF;--ok:#11845B;--ok-soft:#E5F5EE;--warn:#A15C07;--warn-soft:#FDF3E3;--bad:#B42318;--bad-soft:#FDECEA;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1115;--card:#171A20;--ink:#ECEEF2;--muted:#9AA1AD;--line:#262A33;--soft:#1E222A;
    --accent:#7C93F5;--accent-ink:#A9B8FA;--accent-soft:#1D2440;--on-accent:#0F1115;
    --ok:#3CCB8C;--ok-soft:#112A20;--warn:#F0B35A;--warn-soft:#2E2312;--bad:#F2786B;--bad-soft:#331816;
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{color:var(--on-accent);width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.title{display:flex;flex-direction:column;flex:1 1 220px;min-width:0}
.title strong{font-size:17px;letter-spacing:-.01em}
.title span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.on i{animation:pulse 1.6s ease-in-out infinite}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
select{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}

.progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.track{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.track div{height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .4s ease}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0}
.steps li{list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.steps li b{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid var(--line);color:var(--muted)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now b{border-color:var(--accent);color:var(--accent)}
.steps li.done b{background:var(--ok);border-color:var(--ok);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card>.head{display:flex;align-items:center;gap:12px;padding:16px 20px}
.num{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.card.done .num{background:var(--ok-soft);color:var(--ok)}
.head .grow{flex:1 1 auto;min-width:0}
.head h2{margin:0;font-size:15px}
.head p{margin:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.card.closed .body{display:none}
label{font-size:13px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text]{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input{flex:1 1 220px;width:auto}
.hint{font-size:12.5px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer}
.btn{height:42px;padding:0 16px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--line);color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:12.5px}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.msg{font-size:13px;border-radius:9px;padding:9px 12px;margin:0}
.msg:empty{display:none}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--soft);color:var(--muted)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.models{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.models:empty{display:none}
.models li{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-top:1px solid var(--line);font-size:14px}
.models li:first-child{border-top:0}
.models li span:first-child{flex:1 1 auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.none{background:var(--soft);color:var(--muted)}
details{border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
details summary{cursor:pointer;font-size:14px;font-weight:600}
details[open] summary{margin-bottom:10px}
details .inner{display:flex;flex-direction:column;gap:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.choice .btn{margin-top:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bar.busy div{width:35%!important;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent);transition:width .3s}
.status{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--soft)}
.status .big{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted)}
.status.on .big{background:var(--ok);color:#fff}
.status.paused .big{background:var(--warn);color:#fff}
.status strong{display:block;font-size:15px}
.status span{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts strong{font-size:15px}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0 0;border-top:1px solid var(--line)}
.toggle .grow{flex:1 1 auto}
.toggle p{margin:0;font-size:12.5px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:0 0 auto}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
footer{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding:0 4px}
[hidden]{display:none!important}
@media (max-width:560px){.steps li span{display:none}.steps li.now span{display:inline}.wrap{padding:18px 14px 36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h4l3-7 2 14 3-7h4"></path></svg></div>
    <div class="title"><strong>somcp-relay</strong><span data-t="ui.tagline"></span></div>
    <span class="pill" id="pill" role="status"><i></i><span id="pill-text"></span></span>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select>
  </header>

  <section class="progress">
    <div class="track"><div id="track"></div></div>
    <ol class="steps">
      <li id="p-shop"><b>1</b><span data-t="ui.progress.shop"></span></li>
      <li id="p-ai"><b>2</b><span data-t="ui.progress.ai"></span></li>
      <li id="p-run"><b>3</b><span data-t="ui.progress.run"></span></li>
    </ol>
  </section>

  <section class="card" id="c-shop">
    <div class="head">
      <span class="num" data-num="1">1</span>
      <div class="grow"><h2 data-t="ui.shop.title"></h2><p id="shop-sum"></p></div>
      <button class="btn ghost small" type="button" data-change="c-shop" data-t="ui.change"></button>
    </div>
    <form class="body" id="pair-form">
      <p class="hint" data-t="ui.shop.intro"></p>
      <p class="msg bad" id="revoked" hidden data-t="ui.shop.revoked"></p>
      <div class="field"><label for="shop" data-t="ui.shop.address"></label><input id="shop" type="text" inputmode="url" placeholder="https://" autocomplete="off" required></div>
      <div class="field"><label for="code" data-t="ui.shop.code"></label><input id="code" class="code" type="text" autocomplete="off" placeholder="XXXX-XXXX" required></div>
      <p class="hint" data-t="ui.shop.paste"></p>
      <div class="row"><button class="btn primary" type="submit" id="pair-btn" data-t="ui.shop.link"></button><span class="hint" data-t="ui.shop.code_hint"></span></div>
      <p class="msg" id="pair-msg" role="status"></p>
    </form>
  </section>

  <section class="card" id="c-ai">
    <div class="head">
      <span class="num" data-num="2">2</span>
      <div class="grow"><h2 data-t="ui.ai.title"></h2><p id="ai-sum"></p></div>
      <button class="btn ghost small" type="button" data-change="c-ai" data-t="ui.change"></button>
    </div>
    <form class="body" id="ai-form">
      <p class="hint" data-t="ui.ai.intro"></p>
      <div class="field">
        <label for="ai" data-t="ui.ai.address"></label>
        <div class="row"><input id="ai" type="text" placeholder="http://localhost:11434" autocomplete="off" required><button class="btn primary" type="submit" id="ai-btn"></button></div>
      </div>
      <div class="row"><button class="chip" type="button" data-preset="http://localhost:11434">Ollama · 11434</button><button class="chip" type="button" data-preset="http://localhost:1234">LM Studio · 1234</button></div>
      <p class="hint" data-t="ui.ai.examples"></p>
      <p class="msg" id="ai-msg" role="status"></p>
      <ul class="models" id="models"></ul>
      <p class="hint" data-t="ui.ai.only_tools"></p>
      <details id="install">
        <summary data-t="ui.ai.none"></summary>
        <div class="inner">
          <p class="hint" data-t="ui.setup.intro"></p>
          <p class="hint" id="memory"></p>
          <div class="choices">
            <div class="choice">
              <strong>Ollama</strong>
              <p class="hint" data-t="ui.setup.ollama"></p>
              <p class="hint mono" id="ollama-model"></p>
              <button class="btn primary" type="button" data-setup="ollama" data-t="ui.setup.go"></button>
            </div>
            <div class="choice">
              <strong>LM Studio</strong>
              <p class="hint" data-t="ui.setup.lmstudio"></p>
              <p class="hint mono" id="lmstudio-model"></p>
              <button class="btn primary" type="button" data-setup="lmstudio" data-t="ui.setup.go"></button>
            </div>
          </div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar" hidden><div></div></div>
          <p class="msg" id="setup-msg" role="status"></p>
        </div>
      </details>
    </form>
  </section>

  <section class="card" id="c-run">
    <div class="head">
      <span class="num">3</span>
      <div class="grow"><h2 data-t="ui.run.title"></h2></div>
      <button class="btn ghost small" type="button" id="pause"></button>
    </div>
    <div class="body">
      <div class="status" id="status">
        <div class="big"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h4l3-7 2 14 3-7h4"></path></svg></div>
        <div><strong id="status-title"></strong><span id="status-text"></span></div>
      </div>
      <p class="msg bad" id="problem"></p>
      <div class="facts">
        <div><span data-t="ui.status.last"></span><strong id="s-last"></strong></div>
        <div><span data-t="ui.run.answered"></span><strong id="s-answered"></strong></div>
        <div><span data-t="ui.status.models"></span><strong id="s-models"></strong></div>
      </div>
      <div class="toggle">
        <div class="grow"><label for="startup" data-t="ui.status.startup"></label><p data-t="ui.run.startup_hint"></p></div>
        <span class="switch"><input id="startup" type="checkbox"><i></i></span>
      </div>
      <div class="toggle">
        <div class="grow"><p data-t="ui.run.danger"></p></div>
        <button class="btn danger small" type="button" id="unlink" data-t="ui.status.unlink"></button>
      </div>
    </div>
  </section>

  <footer><span data-t="ui.shop.note"></span><span data-t="ui.status.note"></span><span id="version"></span></footer>
</div>
<script>
(function () {
  'use strict';
  // The token arrives in the address fragment, which never reaches a
  // server log, and is kept for this tab only.
  var token = location.hash.slice(1);
  try { token = token || sessionStorage.getItem('relay-token') || ''; if (location.hash) { sessionStorage.setItem('relay-token', token); } } catch (e) {}
  if (location.hash) { history.replaceState(null, '', '/'); }
  var texts = {};
  var state = null;
  // Models of the last test in this window; the running relay's otherwise.
  var tested = null;
  var testing = false;
  var autoTested = false;
  var shownSetup = '';
  // What answered at the address, from the last test or setup here.
  var software = '';
  // A card reopened with Change stays open until its step is done again.
  var opened = {};

  function t(key) { return texts[key] || key; }
  function fmt(key) { var args = Array.prototype.slice.call(arguments, 1); var i = 0; return t(key).replace(/%[sd]/g, function () { return String(args[i++]); }); }
  function $(id) { return document.getElementById(id); }

  function api(path, body) {
    return fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'X-Relay-Token': token, 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) { throw new Error(j && j.error || r.status); } return j; }); });
  }

  function say(id, text, kind) { var el = $(id); el.textContent = text || ''; el.className = 'msg ' + (kind || 'info'); }
  function busy(button, on, label) {
    button.disabled = on;
    button.textContent = '';
    if (on) { var s = document.createElement('span'); s.className = 'spin'; button.appendChild(s); }
    button.appendChild(document.createTextNode(label));
  }

  function models() { return tested || (state && state.relay && state.relay.models) || []; }
  function toolCount() { return models().filter(function (m) { return m.tools === true; }).length; }

  function drawModels() {
    var list = $('models');
    list.textContent = '';
    models().forEach(function (m) {
      var li = document.createElement('li');
      var name = document.createElement('span'); name.textContent = m.id;
      var badge = document.createElement('span');
      badge.className = 'badge ' + (m.tools === true ? 'ok' : (m.tools === false ? 'bad' : 'none'));
      badge.textContent = t(m.tools === true ? 'llm.tools_ok' : (m.tools === false ? 'llm.tools_no' : 'llm.tools_untested'));
      li.appendChild(name); li.appendChild(badge); list.appendChild(li);
    });
  }

  function setCard(id, done) {
    var card = $(id);
    if (done && opened[id] === 'done') { delete opened[id]; }
    card.classList.toggle('done', done);
    card.classList.toggle('closed', done && !opened[id]);
    card.querySelector('[data-change]').hidden = !done || !!opened[id];
    var num = card.querySelector('.num');
    num.textContent = done ? '✓' : num.getAttribute('data-num');
  }

  function draw() {
    texts = state.texts;
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
    $('lang').value = state.lang;
    $('version').textContent = fmt('ui.version', state.version);
    if (!$('shop').value && document.activeElement !== $('shop')) { $('shop').value = state.shop.url || ''; }
    if (!$('ai').value && document.activeElement !== $('ai')) { $('ai').value = state.ai || ''; }
    $('memory').textContent = state.memory ? fmt('ui.setup.memory', state.memory) : '';
    $('ollama-model').textContent = state.recommend;
    $('lmstudio-model').textContent = state.lmstudio;
    $('revoked').hidden = !state.revoked || state.shop.linked;

    var linked = !!state.shop.linked;
    var ready = !!state.ai && toolCount() > 0;
    var running = state.carrier !== '' && state.running;
    var paused = running && state.paused;

    setCard('c-shop', linked);
    setCard('c-ai', ready);
    $('shop-sum').textContent = linked ? fmt('ui.shop.summary', state.shop.name ? state.shop.name + ' · ' + state.shop.url : state.shop.url) : '';
    $('ai-sum').textContent = ready ? fmt('ui.ai.summary', software || (state.relay && state.relay.software) || 'AI', state.ai, toolCount()) : '';
    if (!testing) {
      drawModels();
      $('ai-btn').textContent = t(models().length ? 'ui.ai.retry' : 'ui.ai.test');
    }

    // Each step lights up once done; the first one not done is the one to
    // work on.
    var done = [linked, ready, running && !paused];
    ['p-shop', 'p-ai', 'p-run'].forEach(function (id, i) {
      var li = $(id);
      li.classList.toggle('done', done[i]);
      li.classList.toggle('now', !done[i] && done.slice(0, i).every(Boolean));
      li.querySelector('b').textContent = done[i] ? '✓' : String(i + 1);
    });
    $('track').style.width = (done.filter(Boolean).length / 3 * 100) + '%';

    var look = paused ? ' paused' : (running ? ' on' : '');
    var title = t(paused ? 'ui.pill.paused' : (running ? 'ui.pill.active' : 'ui.pill.waiting'));
    $('pill').className = 'pill' + look;
    $('pill-text').textContent = title;
    $('status').className = 'status' + look;
    $('status-title').textContent = title;
    $('status-text').textContent = t(paused ? 'ui.run.paused' : (running ? (state.carrier === 'service' ? 'ui.run.service' : 'ui.run.here') : 'ui.run.waiting'));
    $('problem').textContent = state.problem ? fmt('ui.run.problem', state.problem) : '';
    var last = state.relay && state.relay.last_contact;
    $('s-last').textContent = last && last.indexOf('0001') !== 0 ? new Date(last).toLocaleTimeString(state.lang) : t('ui.never');
    $('s-answered').textContent = String((state.relay && state.relay.answered) || 0);
    $('s-models').textContent = String(toolCount());
    $('pause').hidden = !linked;
    $('pause').textContent = t(state.paused ? 'ui.status.resume' : 'ui.status.pause');
    $('unlink').disabled = !linked;
    $('startup').checked = !!state.startup;

    // The setup runs in the relay, which may outlive this tab: the page
    // only draws where it stands.
    var setup = state.setup || {};
    var installing = !!setup.running;
    document.querySelectorAll('[data-setup]').forEach(function (b) { b.disabled = installing; });
    $('bar').hidden = !setup.key;
    $('bar').classList.toggle('busy', installing && setup.percent < 0);
    $('bar').firstElementChild.style.width = (setup.done ? 100 : Math.max(0, setup.percent || 0)) + '%';
    if (setup.key) {
      say('setup-msg', fmt.apply(null, [setup.key].concat(setup.args || [])), setup.done ? 'ok' : (installing ? 'info' : 'bad'));
      if (installing) { $('install').open = true; }
    }
    if (setup.done && setup.address && setup.address !== shownSetup) {
      // Done: the address and its tested models, as after a Test.
      shownSetup = setup.address;
      $('ai').value = setup.address;
      tested = setup.models || [];
      software = setup.software || '';
    }

    // The first check runs on its own: an address already saved is tested
    // once when the window opens; after that, Test again is the button.
    if (!autoTested && linked && state.ai && !ready && !testing) { autoTested = true; testAI(); }
  }

  function refresh() { return api('/api/state').then(function (s) { state = s; draw(); }).catch(function () {}); }

  function pair() {
    var button = $('pair-btn');
    busy(button, true, t('ui.working'));
    say('pair-msg', '');
    api('/api/pair', { shop: $('shop').value.trim(), code: $('code').value.trim() })
      .then(function (info) {
        say('pair-msg', fmt('ui.shop.linked', info.name + ' (PrestaShop ' + info.version + ')'), 'ok');
        $('code').value = '';
        opened['c-shop'] = 'done';
        return refresh();
      })
      .catch(function (err) { say('pair-msg', fmt('err.generic', err.message), 'bad'); })
      .then(function () { busy(button, false, t('ui.shop.link')); });
  }

  function testAI() {
    var button = $('ai-btn');
    testing = true;
    busy(button, true, t('ui.working'));
    say('ai-msg', '');
    api('/api/ai', { address: $('ai').value.trim() })
      .then(function (r) {
        tested = r.models;
        software = r.software;
        if (toolCount()) {
          say('ai-msg', r.software + ' - ' + fmt('ui.ai.found', r.models.length), 'ok');
        } else {
          say('ai-msg', t('ui.ai.no_tools'), 'bad');
          $('install').open = true;
        }
        opened['c-ai'] = 'done';
      })
      .catch(function (err) { tested = []; say('ai-msg', fmt('ai.fail', $('ai').value, err.message), 'bad'); })
      .then(function () { testing = false; return refresh(); })
      .then(function () { busy(button, false, t(models().length ? 'ui.ai.retry' : 'ui.ai.test')); });
  }

  // The back office shows a ready command: pasted into either field, it
  // fills both and links at once.
  function takeCommand(event) {
    var m = /pair\s+(\S+)\s+([A-Za-z0-9]{4}-?[A-Za-z0-9]{4})/.exec(event.target.value);
    if (!m) { return; }
    $('shop').value = m[1];
    $('code').value = m[2].toUpperCase();
    pair();
  }
  $('shop').addEventListener('input', takeCommand);
  $('code').addEventListener('input', takeCommand);

  document.querySelectorAll('[data-change]').forEach(function (b) {
    b.addEventListener('click', function () { opened[b.getAttribute('data-change')] = true; draw(); });
  });
  document.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () { $('ai').value = b.getAttribute('data-preset'); testAI(); });
  });
  $('lang').addEventListener('change', function () { api('/api/lang', { lang: $('lang').value }).then(refresh); });
  $('pair-form').addEventListener('submit', function (e) { e.preventDefault(); pair(); });
  $('ai-form').addEventListener('submit', function (e) { e.preventDefault(); testAI(); });
  document.querySelectorAll('[data-setup]').forEach(function (b) {
    b.addEventListener('click', function () {
      api('/api/setup', { kind: b.getAttribute('data-setup') }).then(refresh)
        .catch(function (err) { say('setup-msg', fmt('err.generic', err.message), 'bad'); });
    });
  });
  $('pause').addEventListener('click', function () { api('/api/pause', { paused: !state.paused }).then(refresh); });
  $('startup').addEventListener('change', function () { api('/api/startup', { on: $('startup').checked }).then(refresh).catch(function (err) { alert(err.message); refresh(); }); });
  $('unlink').addEventListener('click', function () { api('/api/unlink', {}).then(function () { opened = {}; tested = null; return refresh(); }); });

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
